name: HealthPulse real WDI browser and checksum QA
on:
  push:
    branches: [main]
    paths:
      - "healthpulse-worldbank.html"
      - "data/healthpulse-worldbank*.json"
      - "scripts/healthpulse_wdi_browser_qa.py"
      - ".github/workflows/healthpulse-wdi-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  healthpulse-real-source-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser QA
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Assert source checksum, interactive charts and CSV export
        run: python scripts/healthpulse_wdi_browser_qa.py
      - name: Upload desktop/mobile browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthpulse-wdi-browser-qa
          path: qa-out/
          if-no-files-found: warn
