name: Sync CommerceLens source-derived demo
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/commercelens-sync.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: commercelens-synthetic-sync
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout audited CommerceLens source
        uses: actions/checkout@v4
        with:
          repository: harshakavali81-collab/Automated-E-commerce-Analytics-Sentiment
          ref: 3d4a8b8525855c2a08939a99999d63400a134df1
          path: _commercelens_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate deterministic real-source charts and site
        working-directory: _commercelens_source
        run: python -m scripts.build_site --out "$RUNNER_TEMP/commercelens-public"
      - name: Install verified safe static report, derived chart SVGs and metrics
        run: |
          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path
          from xml.etree import ElementTree
          src=Path("/tmp") # Runner temp is passed through environment below
          import os
          src=Path(os.environ["RUNNER_TEMP"])/"commercelens-public"
          html=(src/"index.html").read_text(encoding="utf-8")
          metrics=json.loads((src/"metrics.json").read_text(encoding="utf-8"))
          assert metrics["source_kind"]=="synthetic_demo"
          assert metrics["observation_count"]==1440
          charts=re.findall(r'(<svg\b[^>]*>.*?</svg>)',html,re.DOTALL)
          assert len(charts)==10,len(charts)
          assert "<script" not in html.lower()
          out=Path("assets/commercelens-derived")
          out.mkdir(parents=True,exist_ok=True)
          names=[
           "01-daily-average-price.svg",
           "02-daily-estimated-revenue.svg",
           "03-category-estimated-revenue.svg",
           "04-category-average-price.svg",
           "05-sentiment-counts.svg",
           "06-category-review-ratings.svg",
           "07-category-discounts.svg",
           "08-product-units.svg",
           "09-review-volume.svg",
           "10-category-inventory.svg"]
          for name,figure in zip(names,charts):
              ElementTree.fromstring(figure)
              (out/name).write_text(figure,encoding="utf-8")
          Path("cases/commercelens-report.html").write_text(html,encoding="utf-8")
          Path("data").mkdir(exist_ok=True)
          shutil.copyfile(src/"metrics.json","data/commercelens_metrics.json")
          case=Path("cases/commercelens.html")
          content=case.read_text(encoding="utf-8")
          marker='id="commercelens-derived-gallery"'
          if marker not in content:
              cards=''.join(
               '<figure><img loading="lazy" decoding="async" src="../assets/commercelens-derived/'
               +name+'" alt="Source-derived synthetic e-commerce chart '+str(i+1)
               +'"><figcaption>Reproducible SQL snapshot · chart '+str(i+1)+'</figcaption></figure>'
               for i,name in enumerate(names))
              section='<section class="section" '+marker+'><div class="shell">'
              section+='<div class="eyebrow">VERIFIED REPRODUCIBLE ANALYTICS</div>'
              section+='<h2>Ten actual data-derived SVG charts</h2>'
              section+='<p>Generated from the checked-in Python pipeline using 1,440 fictional product-day records. These differ from the design illustrations: values are computed from the deterministic SQLite snapshot, not arbitrary display data. No merchant data or customer reviews are published.</p>'
              section+='<p><a class="btn" href="commercelens-report.html">Open the complete source-generated analytics report ↗</a></p>'
              section+='<div class="gallery">'+cards+'</div></div></section>'
              assert '</main>' in content
              content=content.replace('</main>',section+'</main>',1)
              case.write_text(content,encoding="utf-8")
          print("Built",len(charts),"real-source SVG charts, standalone report and source metadata")
          PY
          rm -rf _commercelens_source
      - name: Publish static portfolio assets with guarded fast-forward
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cases/commercelens.html cases/commercelens-report.html assets/commercelens-derived data/commercelens_metrics.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish 10 real source-generated CommerceLens charts and standalone report"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Portfolio data-derived CommerceLens report published"
              exit 0
            fi
            sleep 3
          done
          echo "Unable to fast-forward; no force push used"
          exit 1
