name: Career portfolio regression checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "portfolio-readiness.html"
      - "career-portfolio.html"
      - "profile.html"
      - "resume.html"
      - "data-analyst-resume.html"
      - "linkedin-projects.html"
      - "resumes.html"
      - "job-platforms.html"
      - "assets/**"
      - "scripts/check_career_dossier.py"
      - "scripts/check_premium_black.py"
      - "scripts/audit_site.py"
      - ".github/workflows/career-regression.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: career-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-site:
    name: Validate career profile, gold theme, resumes, 31 projects and links
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check recruiter career dossier and 12 career elements
        id: dossier
        run: python scripts/check_career_dossier.py
      - name: Check luxury black/gold structure and 31 project links
        id: theme
        run: python scripts/check_premium_black.py
      - name: Audit all internal URLs, anchors and source assets
        id: links
        run: python scripts/audit_site.py
      - name: Validate role selection, print-safe resumes and declared visual palette
        id: roles
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path("index.html").read_text(encoding="utf-8")
          script = Path("assets/kedhar-inspired.js").read_text(encoding="utf-8")
          style = Path("assets/portfolio-upgrade.css").read_text(encoding="utf-8")
          for role in ("Data Analyst", "AI / ML", "Python Developer"):
              assert f'data-role="{role}"' in index, role
              assert f'"{role}":' in script, role
          assert "KH / RESUME READER & RESPONSIVE FIX" in style
          assert "KH GOLD-ONLY CAREER RELEASE" in style
          for p in ("resume.html", "data-analyst-resume.html"):
              html = Path(p).read_text(encoding="utf-8")
              assert 'class="kh-resume-screen"' in html, p
              assert 'href="assets/portfolio-upgrade.css?v=20261028"' in html, p
              assert "window.print()" in html, p
          assert 'id="career-12"' in index
          assert index.count('class="bh-project-source" href=') == 31
          print("PASS: all three role selectors, black/gold screen CVs, print controls, source-linked projects.")
          PY

      - name: Publish a reproducible career regression summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOSSIER_STATUS: ${{ steps.dossier.outcome }}
          THEME_STATUS: ${{ steps.theme.outcome }}
          LINKS_STATUS: ${{ steps.links.outcome }}
          ROLES_STATUS: ${{ steps.roles.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kh-regression"
          cd "$RUNNER_TEMP/kh-regression"
          git init -q
          git config user.name "portfolio-qa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch -q origin qa-reports
          git checkout -q -b qa-reports FETCH_HEAD
          {
            echo "# Career portfolio regression report"
            echo
            echo "Source commit: $GITHUB_SHA"
            echo
            echo "Generated UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| 12-element career dossier | $DOSSIER_STATUS |"
            echo "| Black-and-gold page and repository structure | $THEME_STATUS |"
            echo "| All site local links and targets | $LINKS_STATUS |"
            echo "| Role selector and screen resume styling | $ROLES_STATUS |"
            echo
            echo "Browser and network QA is separately measured by live-qa.yml."
            echo "This report records actual command exit outcomes, not assumed success."
          } > career-regression-summary.md
          git add career-regression-summary.md
          if ! git diff --cached --quiet; then
            git commit -qm "Record source regression outcomes for $GITHUB_SHA"
            for attempt in 1 2 3; do
              git pull --rebase -q origin qa-reports || exit 1
              if git push -q origin HEAD:qa-reports; then
                exit 0
              fi
              sleep 3
            done
            echo "Could not publish regression report after three attempts" >&2
            exit 1
          fi
