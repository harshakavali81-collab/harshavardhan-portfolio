name: Portfolio quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit DocSight browser demo and JavaScript
        run: python3 scripts/check_docsight_demo.py
      - name: Check HTML navigation, assets, and case-study sections
        run: python3 scripts/audit_site.py
      - name: Check recruiter profile, theme, and contact options
        run: python3 scripts/check_career_profile.py
      - name: Check job-platform project showcase
        run: python3 scripts/check_job_platforms.py
      - name: Validate refined light-gold design and 31-source project gallery
        run: python3 scripts/check_light_portfolio.py

      - name: Validate premium black identity, recruiter resources and all 31 projects
        run: python3 scripts/check_premium_black.py

      - name: Validate complete career dossier, links and obsidian-gold design
        run: python3 scripts/check_career_dossier.py
