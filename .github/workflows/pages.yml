name: Deploy Portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Checkout public MobilityPulse AI source at audited revision
        uses: actions/checkout@v4
        with:
          repository: harshakavali81-collab/MobilityPulse-AI-Public-Transport-Reliability-Accessibility-Intelligence
          ref: aee200bcb2f4d54b2f359d4c4910cda0aa5304ef
          path: _mobilitypulse_source
          persist-credentials: false
      - name: Setup Python to export synthetic API data
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: _mobilitypulse_source/requirements.txt
      - name: Setup Node to compile the React dashboard
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _mobilitypulse_source/frontend/package-lock.json
      - name: Install the MobilityPulse backend and export synthetic snapshots
        working-directory: _mobilitypulse_source
        env:
          PYTHONPATH: .:src
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python scripts/export_static_api.py
      - name: Build the real MobilityPulse React dashboard for the portfolio subpath
        working-directory: _mobilitypulse_source/frontend
        env:
          VITE_STATIC_DEMO: 'true'
          VITE_BASE_PATH: /harshavardhan-portfolio/mobilitypulse-demo/
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install the compiled dashboard into the portfolio
        run: |
          mkdir -p mobilitypulse-demo
          cp -r _mobilitypulse_source/frontend/dist/. mobilitypulse-demo/
          test -f mobilitypulse-demo/index.html
          test -f mobilitypulse-demo/sample-api/overview.json
          test -f mobilitypulse-demo/sample-api/analytics/reliability.json
          test -f mobilitypulse-demo/sample-api/feed/predictions.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path("mobilitypulse-demo/sample-api")
          overview=json.loads((base/"overview.json").read_text())
          routes=json.loads((base/"routes.json").read_text())
          assert overview["metadata"]["data_mode"]=="synthetic"
          assert overview["metadata"]["live_tracking"] is False
          assert len(routes["items"]) >= 4
          print("React static dashboard and clearly synthetic snapshots verified")
          PY
          rm -rf _mobilitypulse_source
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload assembled portfolio and interactive dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
