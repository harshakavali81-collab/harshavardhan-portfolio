name: AirAware AI — Python tests and React build
on:
  push:
    paths:
      - 'projects/AirAware-AI/**'
      - '.github/workflows/airaware-ci.yml'
  pull_request:
    paths:
      - 'projects/AirAware-AI/**'
      - '.github/workflows/airaware-ci.yml'
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/AirAware-AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m compileall -q backend src scripts
  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/AirAware-AI/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
